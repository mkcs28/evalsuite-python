# Publish to PyPI when a version tag is pushed (git tag v0.3.1 && git push origin v0.3.1),
# or when a release is created in the GitHub UI with a new tag (the tag push triggers this workflow).
# Uses PyPI Trusted Publishing: no API tokens are stored. Configure a publisher on pypi.org for project
# "evalsuite-python", owner "mkcs28", repository "evalsuite-python", workflow "release.yml", environment "pypi".
#
# Run it by hand (Actions -> Release -> Run workflow, with a tag such as v0.3.0) to attach the files that are
# already on PyPI to that tag's GitHub release, without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose PyPI files should be attached to its GitHub release (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        id: version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/evalsuite/version.py').read()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/evalsuite/version.py ($version). Delete the tag, fix the version and tag again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Version must not already be on PyPI
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/evalsuite-python/${{ steps.version.outputs.version }}/json")
          if [ "$code" = "200" ]; then
            echo "::error::evalsuite-python ${{ steps.version.outputs.version }} is already on PyPI. PyPI never accepts the same version twice: bump src/evalsuite/version.py and tag again. To attach the existing files to the GitHub release, run this workflow by hand with the tag."
            exit 1
          fi
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest --cov=evalsuite --cov-fail-under=95
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Built files must carry the tag's version
        run: |
          v=${{ steps.version.outputs.version }}
          ls dist
          test -f "dist/evalsuite_python-$v-py3-none-any.whl" || { echo "::error::wheel for $v missing from dist/"; exit 1; }
          test -f "dist/evalsuite_python-$v.tar.gz" || { echo "::error::sdist for $v missing from dist/"; exit 1; }
          [ "$(ls dist | wc -l)" = "2" ] || { echo "::error::dist/ must contain exactly the wheel and the sdist"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Add a required reviewer to the "pypi" environment (Settings -> Environments) to approve each release.
    environment:
      name: pypi
      url: https://pypi.org/project/evalsuite-python/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release, or attach the files if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *a*|*b*|*rc*) prerelease="--prerelease";; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created in the GitHub UI to make the tag: attach (or replace) the files instead of failing.
            echo "Release $TAG already exists; attaching the built files."
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "evalsuite-python ${TAG#v}" --notes "See CHANGELOG.md for the changes in this version." $prerelease
          fi

  # Manual run: attach the files published on PyPI for an existing tag to its GitHub release.
  attach-pypi-files:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the PyPI files and check their hashes
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag must look like v0.3.0, got '$TAG'"; exit 1;; esac
          v=${TAG#v}
          mkdir dist
          curl -sf "https://pypi.org/pypi/evalsuite-python/$v/json" -o meta.json \
            || { echo "::error::evalsuite-python $v is not on PyPI."; exit 1; }
          python3 - "$v" <<'PY'
          import hashlib, json, sys, urllib.request
          version = sys.argv[1]
          files = json.load(open("meta.json"))["urls"]
          if len(files) != 2:
              sys.exit(f"::error::expected a wheel and an sdist for {version} on PyPI, found {len(files)}")
          for f in files:
              data = urllib.request.urlopen(f["url"]).read()
              if hashlib.sha256(data).hexdigest() != f["digests"]["sha256"]:
                  sys.exit(f"::error::sha256 mismatch for {f['filename']}")
              open(f"dist/{f['filename']}", "wb").write(data)
              print("verified", f["filename"])
          PY
      - name: Attach to the GitHub release (created if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null \
            || { echo "::error::Tag $TAG does not exist in $GITHUB_REPOSITORY."; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "evalsuite-python ${TAG#v}" --notes "See CHANGELOG.md for the changes in this version."
          fi
