# Build the sdist, the pure-Python wheel and binary wheels with the compiled core (Linux x86_64/aarch64 glibc and
# musl, macOS arm64/x86_64, Windows x64/arm64; abi3 for Python >= 3.9), test them, and publish to PyPI when a
# version tag is pushed (git tag v0.3.1 && git push origin v0.3.1),
# or when a release is created in the GitHub UI with a new tag (the tag push triggers this workflow).
# Uses PyPI Trusted Publishing: no API tokens are stored. Configure a publisher on pypi.org for project
# "evalsuite-python", owner "mkcs28", repository "evalsuite-python", workflow "release.yml", environment "pypi".
#
# Run it by hand (Actions -> Release -> Run workflow, with a tag such as v0.3.0) to attach the files that are
# already on PyPI to that tag's GitHub release, without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose PyPI files should be attached to its GitHub release (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Checks, tests, the sdist and the pure-Python wheel (the fallback for platforms without a binary wheel).
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version (Python and Rust)
        id: version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/evalsuite/version.py').read()).group(1))")
          cargo_version=$(python -c "import re;print(re.search(r'^version = \"(.+)\"', open('rust/Cargo.toml').read(), re.M).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/evalsuite/version.py ($version). Delete the tag, fix the version and tag again."
            exit 1
          fi
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::rust/Cargo.toml ($cargo_version) and src/evalsuite/version.py ($version) differ."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Version must not already be on PyPI
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/evalsuite-python/${{ steps.version.outputs.version }}/json")
          if [ "$code" = "200" ]; then
            echo "::error::evalsuite-python ${{ steps.version.outputs.version }} is already on PyPI. PyPI never accepts the same version twice: bump src/evalsuite/version.py and rust/Cargo.toml and tag again. To attach the existing files to the GitHub release, run this workflow by hand with the tag."
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check && cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path rust/Cargo.toml -p evalsuite-core
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]" hatchling build twine
      - run: ruff check . && ruff format --check . && mypy
      - run: python -c "from evalsuite import _native; assert _native.backend() == 'rust'"
      - run: pytest --cov=evalsuite --cov-fail-under=95
      - run: EVALSUITE_PURE_PYTHON=1 pytest -q -p no:cacheprovider -o addopts=""
      - name: Build the sdist and the pure-Python wheel
        run: |
          python -m build --sdist
          python scripts/build_pure_wheel.py dist
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist-pure
          path: dist/
          if-no-files-found: error

  # Binary wheels with the compiled core (.github/workflows/wheels.yml, also run on changes to the core).
  wheels:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/wheels.yml

  # All files together: the same checks the CI package job runs, then one artifact for publishing.
  collect:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - run: python -m pip install --upgrade pip twine
      - run: ls -l dist && twine check --strict dist/*
      - name: Every file carries the tag's version; one sdist, one pure wheel, eight binary wheels
        run: |
          v=${{ needs.build.outputs.version }}
          test -f "dist/evalsuite_python-$v.tar.gz" || { echo "::error::sdist for $v missing"; exit 1; }
          test -f "dist/evalsuite_python-$v-py3-none-any.whl" || { echo "::error::pure-Python wheel for $v missing"; exit 1; }
          n=$(ls dist/evalsuite_python-$v-cp39-abi3-*.whl | wc -l)
          [ "$n" = "8" ] || { echo "::error::expected 8 binary wheels, found $n"; exit 1; }
          [ "$(ls dist | wc -l)" = "10" ] || { echo "::error::dist/ must contain exactly the sdist and 9 wheels"; exit 1; }
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [build, collect]
    runs-on: ubuntu-latest
    # Add a required reviewer to the "pypi" environment (Settings -> Environments) to approve each release.
    environment:
      name: pypi
      url: https://pypi.org/project/evalsuite-python/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    needs: [build, collect, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signed build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Signed build provenance for every file (verify with `gh attestation verify <file> -R mkcs28/evalsuite-python`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Software bill of materials (CycloneDX) of the installed package
        run: |
          python -m venv /tmp/sbom && /tmp/sbom/bin/pip install -q dist/evalsuite_python-*-cp39-abi3-manylinux*x86_64.whl cyclonedx-bom
          /tmp/sbom/bin/cyclonedx-py environment /tmp/sbom/bin/python --output-format JSON -o "dist/evalsuite_python-${{ needs.build.outputs.version }}.cdx.json"
      - name: Create the GitHub release, or attach the files if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *a*|*b*|*rc*) prerelease="--prerelease";; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created in the GitHub UI to make the tag: attach (or replace) the files instead of failing.
            echo "Release $TAG already exists; attaching the built files."
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "evalsuite-python ${TAG#v}" --notes "See CHANGELOG.md for the changes in this version." $prerelease
          fi

  # Manual run: attach the files published on PyPI for an existing tag to its GitHub release.
  attach-pypi-files:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the PyPI files and check their hashes
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag must look like v0.3.0, got '$TAG'"; exit 1;; esac
          v=${TAG#v}
          mkdir dist
          curl -sf "https://pypi.org/pypi/evalsuite-python/$v/json" -o meta.json \
            || { echo "::error::evalsuite-python $v is not on PyPI."; exit 1; }
          python3 - "$v" <<'PY'
          import hashlib, json, sys, urllib.request
          version = sys.argv[1]
          files = json.load(open("meta.json"))["urls"]
          if not any(f["packagetype"] == "sdist" for f in files) or not any(
              f["packagetype"] == "bdist_wheel" for f in files
          ):
              sys.exit(f"::error::expected wheels and an sdist for {version} on PyPI, found {len(files)} files")
          for f in files:
              data = urllib.request.urlopen(f["url"]).read()
              if hashlib.sha256(data).hexdigest() != f["digests"]["sha256"]:
                  sys.exit(f"::error::sha256 mismatch for {f['filename']}")
              open(f"dist/{f['filename']}", "wb").write(data)
              print("verified", f["filename"])
          PY
      - name: Attach to the GitHub release (created if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null \
            || { echo "::error::Tag $TAG does not exist in $GITHUB_REPOSITORY."; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "evalsuite-python ${TAG#v}" --notes "See CHANGELOG.md for the changes in this version."
          fi
