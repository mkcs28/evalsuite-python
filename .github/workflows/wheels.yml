# Binary wheels with the compiled core: Linux x86_64/aarch64 (glibc manylinux2014 and musl), macOS arm64/x86_64,
# Windows x64/arm64. abi3: one wheel per platform serves Python 3.9 to 3.14. Wheels that can run on their build
# machine are installed and smoke-tested there.
#
# Called by release.yml for every release; also runs when the core or the build configuration changes, so the
# cross-platform builds are known to work before a release is tagged.
name: Wheels

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "pyproject.toml"
      - "src/evalsuite/_native.py"
      - ".github/workflows/wheels.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014", test: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2014", test: false }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { os: macos-latest, target: aarch64, manylinux: "", test: true }
          - { os: macos-latest, target: x86_64, manylinux: "", test: false }
          - { os: windows-latest, target: x64, manylinux: "", test: true }
          - { os: windows-11-arm, target: aarch64, manylinux: "", test: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: Install the wheel and run the smoke test on the build machine
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/evalsuite/version.py').read()).group(1))")
          cd "$RUNNER_TEMP"
          python -c "from evalsuite import _native; assert _native.backend() == 'rust', _native.backend()"
          python "$GITHUB_WORKSPACE/scripts/smoke.py" "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl
          if-no-files-found: error

