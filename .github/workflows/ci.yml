name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: pytest --cov=evalsuite --cov-report=term-missing --cov-fail-under=95

  min-deps:
    # The oldest dependency versions pyproject.toml allows must still work.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install "numpy==1.22.4" "scipy==1.8.1" "pandas==1.4.4" "matplotlib==3.5.3" "scikit-learn==1.4.2" "statsmodels==0.13.5" pytest hypothesis pillow
      - run: pip install --no-deps -e .
      - run: pip check
      - run: pytest tests/unit tests/classification tests/regression tests/clinical tests/stats tests/vision/test_edges.py -q -p no:cacheprovider

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the distributions (version, metadata, no stray or secret files)
        run: python scripts/check_dist.py dist
      - name: Install the wheel and the sdist in clean environments (no dev tools, no scikit-learn)
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/evalsuite/version.py').read()).group(1))")
          for kind in whl tar.gz; do
            python -m venv "/tmp/clean-$kind"
            # A fresh venv ships the pip bundled with Python, which can have known advisories; upgrade it so the
            # audit below reports on EvalSuite's dependencies, not on the bootstrap tooling.
            "/tmp/clean-$kind/bin/python" -m pip install --upgrade pip setuptools
            "/tmp/clean-$kind/bin/pip" install dist/*.$kind
            "/tmp/clean-$kind/bin/pip" check
            (cd /tmp && "/tmp/clean-$kind/bin/python" "$GITHUB_WORKSPACE/scripts/smoke.py" "$version") | tee "/tmp/smoke-$kind.txt"
          done
          # Wheel and sdist must behave identically.
          diff /tmp/smoke-whl.txt /tmp/smoke-tar.gz.txt
      - name: Audit runtime dependencies
        run: /tmp/clean-whl/bin/pip install pip-audit && /tmp/clean-whl/bin/pip-audit --skip-editable
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
