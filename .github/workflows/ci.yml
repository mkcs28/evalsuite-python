name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # The compiled core and the pure-Rust crate: formatting, lints (warnings are errors), the core's unit tests and
    # the crate's parity tests against fixtures produced by the Python package.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml -p evalsuite-core
      - run: cargo test --manifest-path rust/Cargo.toml -p evalsuite --release

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; test it on 22.04.
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - name: The compiled core must be built and in use
        run: python -c "from evalsuite import _native; assert _native.backend() == 'rust', _native.backend()"
      - run: pytest --cov=evalsuite --cov-report=term-missing --cov-fail-under=95

  pure-python:
    # Without the compiled core (as the pure-Python wheel runs), everything must still pass.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVALSUITE_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: python -c "from evalsuite import _native; assert _native.backend() == 'python'"
      - run: pytest -q

  min-deps:
    # The oldest dependency versions pyproject.toml allows must still work.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install "numpy==1.22.4" "scipy==1.8.1" "pandas==1.4.4" "matplotlib==3.5.3" "scikit-learn==1.4.2" "statsmodels==0.13.5" pytest hypothesis pillow
      - run: pip install --no-deps -e .
      - run: pip check
      - run: python -c "from evalsuite import _native; assert _native.backend() == 'rust'"
      - run: pytest tests/test_native.py tests/unit tests/classification tests/regression tests/clinical tests/stats tests/vision/test_edges.py tests/llmsys -q -p no:cacheprovider

  package:
    runs-on: ubuntu-latest
    needs: [rust, lint, test, pure-python]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools build twine hatchling
      - name: Build the sdist and a binary wheel (maturin), and the pure-Python wheel (hatchling)
        run: |
          python -m build
          python scripts/build_pure_wheel.py dist
          ls -l dist
      - run: twine check --strict dist/*
      - name: Check the distributions (version, metadata, compiled core, no stray or secret files)
        run: python scripts/check_dist.py dist
      - name: Install each distribution in a clean environment (no dev tools, no scikit-learn)
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/evalsuite/version.py').read()).group(1))")
          binary=$(ls dist/*-cp39-abi3-*.whl)
          pure=$(ls dist/*-py3-none-any.whl)
          sdist=$(ls dist/*.tar.gz)
          for kind in binary pure sdist; do
            python -m venv "/tmp/clean-$kind"
            # A fresh venv ships the pip bundled with Python, which can have known advisories; upgrade it so the
            # audit below reports on EvalSuite's dependencies, not on the bootstrap tooling.
            "/tmp/clean-$kind/bin/python" -m pip install --upgrade pip setuptools
            "/tmp/clean-$kind/bin/pip" install "${!kind}"
            "/tmp/clean-$kind/bin/pip" check
            (cd /tmp && "/tmp/clean-$kind/bin/python" -c "from evalsuite import _native; print('backend', _native.backend())")
            (cd /tmp && "/tmp/clean-$kind/bin/python" "$GITHUB_WORKSPACE/scripts/smoke.py" "$version") | tee "/tmp/smoke-$kind.txt"
          done
          # The binary wheel, the source build and the pure-Python fallback must give identical results.
          diff /tmp/smoke-binary.txt /tmp/smoke-pure.txt
          diff /tmp/smoke-binary.txt /tmp/smoke-sdist.txt
          (cd /tmp && /tmp/clean-binary/bin/python -c "from evalsuite import _native; assert _native.backend() == 'rust'")
          (cd /tmp && /tmp/clean-pure/bin/python -c "from evalsuite import _native; assert _native.backend() == 'python'")
      - name: Audit runtime dependencies
        run: /tmp/clean-binary/bin/pip install pip-audit && /tmp/clean-binary/bin/pip-audit --skip-editable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
