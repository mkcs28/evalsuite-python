# The C API (rust/evalsuite-capi) and the R and Julia bindings built on it: build the library, run the C demo, and
# check that R and Julia give the same values as the Rust engine.
name: Bindings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-r-julia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release -p evalsuite-capi --manifest-path rust/Cargo.toml
      - name: C demo
        run: |
          cc -O2 rust/evalsuite-capi/examples/demo.c -Irust/evalsuite-capi/include -Lrust/target/release -levalsuite_c -o demo
          LD_LIBRARY_PATH=rust/target/release ./demo | tee out.txt
          grep -q '"value":0.6666666666666666' out.txt
      - uses: r-lib/actions/setup-r@v2
      - name: R package
        run: |
          Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
          EVALSUITE_RUST_DIR=$PWD/rust R CMD INSTALL bindings/r
          Rscript -e 'library(evalsuite); v <- es_metric("f1", y_true = c(0,1,1,0), y_pred = c(0,1,0,0)); stopifnot(abs(v - 2/3) < 1e-15); print(v)'
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Julia package
        env:
          EVALSUITE_LIB: ${{ github.workspace }}/rust/target/release/libevalsuite_c.so
        run: |
          julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); using EvalSuite; v = metric("f1"; y_true=[0,1,1,0], y_pred=[0,1,0,0]); @assert abs(v - 2/3) < 1e-15; println(v)'
