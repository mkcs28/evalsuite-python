[package]
name = "evalsuite"
description = "Evaluation metrics and statistics for machine learning, NLP, computer vision, clinical models and LLM systems: classification, regression, text generation, retrieval, segmentation, detection, calibration, hypothesis tests and bootstrap intervals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://evalsuite-nine.vercel.app"
documentation = "https://docs.rs/evalsuite"
readme = "README.md"
keywords = ["evaluation", "metrics", "machine-learning", "statistics", "nlp"]
categories = ["science", "algorithms", "mathematics"]
# The parity tests need ~30 MB of fixtures generated by the Python package; they stay in the repository.
exclude = ["tests/"]

[dependencies]
evalsuite-core = { path = "../evalsuite-core", version = "1.1.1" }
libm = "0.2"
rayon = "1.12"
regex = "1"
fancy-regex = "0.14"
roxmltree = "0.20"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rustpython-parser = { version = "0.4", optional = true }

[features]
default = ["python"]
# Python source analysis for `code_complexity`, CodeBLEU's syntax / data-flow match and the built-in syntax check.
python = ["dep:rustpython-parser"]


[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "metrics"
harness = false
