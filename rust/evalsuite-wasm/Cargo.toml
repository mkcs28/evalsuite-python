[package]
name = "evalsuite-wasm"
description = "EvalSuite metrics for JavaScript and the browser (WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evalsuite = { path = "../evalsuite", version = "0.8.5", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
