[workspace]
members = ["evalsuite-core", "evalsuite", "evalsuite-cli", "evalsuite-py", "evalsuite-wasm", "evalsuite-capi"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Manoj Kumar C S", "Nikhil D Bharadwaj"]
repository = "https://github.com/mkcs28/evalsuite-python"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
