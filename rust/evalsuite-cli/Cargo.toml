[package]
name = "evalsuite-cli"
description = "Command-line evaluation from CSV / TSV / JSON files with EvalSuite: classification, regression, diagnostic accuracy, calibration and text-generation metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://evalsuite-nine.vercel.app"
readme = "README.md"
keywords = ["evaluation", "metrics", "cli", "machine-learning", "statistics"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "evalsuite"
path = "src/main.rs"

[dependencies]
evalsuite = { path = "../evalsuite", version = "1.0.0" }
clap = { version = "~4.5", features = ["derive"] }
csv = "1.3"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
serde_json = "1"
