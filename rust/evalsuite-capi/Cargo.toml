[package]
name = "evalsuite-capi"
description = "C ABI for EvalSuite (used by the R and Julia bindings)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "evalsuite_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
evalsuite = { path = "../evalsuite", version = "1.1.2", default-features = false }
