[build-system]
# The compiled core (Rust, in rust/) is built by maturin into evalsuite._core. Hatchling builds the same package
# without it (scripts/build_pure_wheel.py): the pure-Python fallback wheel for platforms without a binary wheel.
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "evalsuite-python"
dynamic = ["version"]
description = "A unified Python framework for machine-learning, clinical, statistical, segmentation, object-detection, uncertainty, and model evaluation."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.9"
authors = [{ name = "Manoj Kumar C S" }, { name = "Nikhil D Bharadwaj" }]
maintainers = [{ name = "Manoj Kumar C S" }, { name = "Nikhil D Bharadwaj" }]
keywords = ["evaluation", "metrics", "segmentation", "object detection", "mAP", "clinical", "diagnostic accuracy", "calibration", "statistical tests", "machine learning", "statistics", "classification", "regression", "reproducibility", "rust"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
vision = ["pillow>=9"]
llm = ["nltk>=3.8"]
sklearn = ["scikit-learn>=1.2"]
keras = ["keras>=3"]
lightning = ["lightning>=2"]
mlflow = ["mlflow>=2"]
docx = ["python-docx>=1.0"]
benchmarks = ["datasets>=2.14"]
wandb = ["wandb>=0.16"]
all = ["matplotlib>=3.5", "pillow>=9", "nltk>=3.8"]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "hypothesis>=6.80",
  "scikit-learn>=1.4",
  "statsmodels>=0.13",
  "scikit-survival>=0.22; python_version >= '3.10'",
  "fairlearn>=0.10",
  "matplotlib>=3.5",
  "pillow>=9",
  "pycocotools>=2.0.7",
  "nltk>=3.8",
  "sacrebleu>=2.4",
  "rouge-score>=0.1.2",
  "pycocoevalcap>=1.2",
  "jsonschema>=4.18",
  "choix>=0.3",
  "krippendorff>=0.6",
  "radon>=6",
  "pot>=0.9; python_version < '3.14'",
  "ranx>=0.3.19; python_version < '3.14'",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs",
  "build",
  "twine",
  "pip-audit",
]

[project.urls]
Homepage = "https://evalsuite-nine.vercel.app"
Documentation = "https://evalsuite-nine.vercel.app/docs"
Source = "https://github.com/mkcs28/evalsuite-python"
Issues = "https://github.com/mkcs28/evalsuite-python/issues"
Changelog = "https://github.com/mkcs28/evalsuite-python/blob/main/CHANGELOG.md"

[project.scripts]
evalsuite = "evalsuite.cli.main:main"

[tool.hatch.version]
path = "src/evalsuite/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsuite"]
exclude = ["src/evalsuite/_core*.so", "src/evalsuite/_core*.pyd"]

[tool.maturin]
manifest-path = "rust/evalsuite-py/Cargo.toml"
python-source = "src"
module-name = "evalsuite._core"
profile = "release"
include = [
  { path = "tests/**/*", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "LICENSE-APACHE", format = "sdist" },
]
exclude = [
  { path = "**/__pycache__/**", format = "sdist" },
  { path = "**/*.pyc", format = "sdist" },
  { path = "rust/target/**", format = "sdist" },
]

[tool.hatch.build.targets.sdist]
include = ["src/evalsuite", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml"]

[tool.ruff]
line-length = 115
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY", "RUF", "S"]
# UP007/UP045: keep Optional[...] and Union[...] for clarity alongside Python 3.9 support.
ignore = ["N803", "N806", "RUF022", "UP007", "UP045", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802", "E501"]
# Metric modules carry full literature references, which are not wrapped.
"src/evalsuite/*/metrics.py" = ["E501"]
# Developer script recording parity fixtures for the Rust crate: each case's lambda runs immediately.
"scripts/rust_fixtures.py" = ["B007", "B023", "E501", "E731", "E741", "RUF005"]
"scripts/make_notebooks.py" = ["E501", "S102"]
"notebooks/*.ipynb" = ["E501", "I001", "S311"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/evalsuite"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optional reference libraries used only by the benchmarks and METEOR's default stemmer
module = ["sacrebleu.*", "rouge_score.*", "nltk.*", "ranx.*", "krippendorff.*", "jsonschema.*", "pycocotools.*", "codebleu.*", "radon.*", "pycocoevalcap.*", "ot.*", "choix.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff.format]
# Generated by scripts/make_notebooks.py.
exclude = ["notebooks/*.ipynb"]
